name: agentguard

on:
  pull_request:
  issues:
    types: [opened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Scan this repository with itself. If the rules ever fire on our own
      # docs, that is a signal worth seeing in CI.
      - name: Self-scan
        run: python agentguard.py path . --all

      - name: Test suite
        run: python -m unittest discover -s tests -v
